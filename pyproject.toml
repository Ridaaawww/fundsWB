[project]
name = "funds-radar"
version = "0.1.0"
description = "Research agent that tracks funding and perks from accelerators, incubators and fellowships worldwide"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.12.0",
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "pyyaml>=6.0.4",
]

[project.scripts]
radar = "radar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["radar"]
